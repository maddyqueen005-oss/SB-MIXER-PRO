
name: Build SB Mixer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Source
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Fix Kotlin Source
        run: |
          sed -i 's/horizontalScrollBarEnabled/isHorizontalScrollBarEnabled/g' extracted/SB_MIXER_PRO_NATIVE_v1_2/app/src/main/java/com/sbmixer/pro/MainActivity.kt

      - name: Build APK
        run: |
          cd extracted/SB_MIXER_PRO_NATIVE_v1_2
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SB-MIXER-PRO-APK
          path: extracted/SB_MIXER_PRO_NATIVE_v1_2/app/build/outputs/apk/debug/app-debug.apk
